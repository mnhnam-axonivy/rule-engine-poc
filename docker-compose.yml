# Axon Ivy Rules Engine: decision runtime next to the Axon Ivy Engine.
#
#   docker compose up -d --build        build and start the runtime on http://localhost:8090
#                                       DMN editor in the browser: http://localhost:8090/editor/
#   docker compose down                 stop it, the model versions stay in the volume
#   docker compose down -v              stop it and delete all model versions
#
# The container holds the rule engine and its database. All versions of all DMN models are stored in the
# volume 'rule-engine-data' and are loaded again after a restart.
services:
  rule-engine:
    image: axonivy/rule-engine-runtime:dev
    build:
      context: rule-engine-runtime
    container_name: axonivy-rule-engine
    ports:
      - "${RULE_ENGINE_PORT:-8090}:8080"
    environment:
      # Shared secret between the Ivy Engine (variable RuleEngine.ApiKey) and the runtime.
      # Leave empty for local development only: without a key the API is open.
      RULE_ENGINE_API_KEY: ${RULE_ENGINE_API_KEY:-}
      # TLS: terminate at a reverse proxy, or let the runtime serve HTTPS itself:
      # QUARKUS_HTTP_SSL_CERTIFICATE_FILES: /certs/tls.crt
      # QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES: /certs/tls.key
      # QUARKUS_HTTP_INSECURE_REQUESTS: disabled
    volumes:
      - rule-engine-data:/data
      # - ./certs:/certs:ro
    restart: unless-stopped

volumes:
  rule-engine-data:
