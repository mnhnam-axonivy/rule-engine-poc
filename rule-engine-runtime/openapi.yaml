---
openapi: 3.1.0
components:
  schemas:
    DecisionInfo:
      type: object
      properties:
        name:
          type: string
        resultType:
          type: string
        requiredInputs:
          type: array
          items:
            type: string
    Error:
      type: object
      properties:
        code:
          type: string
          description: "Stable error code, e.g. MODEL_NOT_FOUND, INVALID_MODEL, EVALUATION_FAILED."
        message:
          type: string
          description: Readable explanation.
        details:
          type: array
          items:
            $ref: "#/components/schemas/ModelMessage"
          description: Findings of the DMN engine.
    EvaluateRequest:
      type: object
      properties:
        decision:
          type: string
          description: Name of the decision to evaluate. Not set = all decisions of
            the model.
        input:
          type: object
          additionalProperties: {}
          description: Input values by the name of the DMN input.
    EvaluateResponse:
      type: object
      properties:
        model:
          type: string
          description: Name of the evaluated model.
        version:
          type: integer
          format: int32
          description: The version that produced the result.
        decision:
          type: string
          description: "The requested decision, if one was named."
        result:
          description: "Result of the requested decision, if one was named."
        results:
          type: object
          additionalProperties: {}
          description: Results of all evaluated decisions by name.
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ModelMessage"
          description: Warnings of the evaluation.
    InputInfo:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        collection:
          type: boolean
    LoadRequest:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          description: The DMN file as XML.
    LoadedVersion:
      type: object
      properties:
        model:
          type: string
        version:
          type: integer
          format: int32
        contentHash:
          type: string
          description: "SHA-256 of the DMN file, line endings ignored."
        dmnName:
          type: string
        dmnNamespace:
          type: string
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/DecisionInfo"
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/InputInfo"
    ModelMessage:
      type: object
      properties:
        severity:
          type: string
        message:
          type: string
        type:
          type: string
        sourceId:
          type: string
    ValidateRequest:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          description: The DMN file as XML.
    ValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ModelMessage"
tags:
- name: Models
  description: "Load versions of DMN models into memory and evaluate their decisions.\
    \ The versions are stored by the Ivy application: it loads a version whenever\
    \ the runtime answers that it does not have it."
- name: Validation
  description: Check a DMN file without storing it.
paths:
  /api/models:
    get:
      summary: Lists the versions in memory.
      tags:
      - Models
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoadedVersion"
  /api/models/{model}:
    delete:
      summary: Removes all versions of a model from memory.
      tags:
      - Models
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
  /api/models/{model}/versions/{version}:
    put:
      summary: "Loads a version into memory, ready to evaluate."
      tags:
      - Models
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/xml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              $ref: "#/components/schemas/LoadRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadedVersion"
      description: Replaces what the runtime holds as this version. An invalid DMN
        file is rejected with INVALID_MODEL and the findings of the DMN engine.
  /api/models/{model}/versions/{version}/evaluate:
    post:
      summary: Evaluates a loaded version.
      description: "MODEL_NOT_FOUND or VERSION_NOT_FOUND if the version is not in\
        \ memory: load it, then try again."
      tags:
      - Models
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResponse"
        "400":
          description: Bad Request
  /api/validate:
    post:
      summary: "Validates a DMN file against the DMN schema, the model rules and the\
        \ compiler."
      tags:
      - Validation
      requestBody:
        content:
          application/xml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResponse"
info:
  title: Axon Ivy Rules Engine - Runtime API
  version: 1.0.0
  description: Loads versions of DMN models into memory and evaluates decisions. The
    versions are stored by the Ivy application.
servers:
- url: http://localhost:8080
  description: Auto generated value
- url: http://0.0.0.0:8080
  description: Auto generated value
