---
openapi: 3.1.0
components:
  schemas:
    ActivateRequest:
      type: object
      properties:
        user:
          type: string
          description: Who activates the version.
        effectiveDate:
          description: Go live at this time instead of now.
          type: string
          $ref: "#/components/schemas/OffsetDateTime"
    DecisionInfo:
      type: object
      properties:
        name:
          type: string
        resultType:
          type: string
        requiredInputs:
          type: array
          items:
            type: string
    Error:
      type: object
      properties:
        code:
          type: string
          description: "Stable error code, e.g. MODEL_NOT_FOUND, INVALID_MODEL, EVALUATION_FAILED."
        message:
          type: string
          description: Readable explanation.
        details:
          type: array
          items:
            $ref: "#/components/schemas/ModelMessage"
          description: Findings of the DMN engine.
    EvaluateRequest:
      type: object
      properties:
        decision:
          type: string
          description: Name of the decision to evaluate. Not set = all decisions of
            the model.
        input:
          type: object
          additionalProperties: {}
          description: Input values by the name of the DMN input.
    EvaluateResponse:
      type: object
      properties:
        model:
          type: string
          description: Name of the evaluated model.
        version:
          type: integer
          format: int32
          description: The version that produced the result.
        decision:
          type: string
          description: "The requested decision, if one was named."
        result:
          description: "Result of the requested decision, if one was named."
        results:
          type: object
          additionalProperties: {}
          description: Results of all evaluated decisions by name.
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ModelMessage"
          description: Warnings of the evaluation.
    InputInfo:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        collection:
          type: boolean
    Model:
      type: object
      properties:
        name:
          type: string
        activeVersion:
          type: integer
          format: int32
          description: The version that answers evaluations. Not set if no version
            is active.
        latestVersion:
          type: integer
          format: int32
        versionCount:
          type: integer
          format: int32
        dmnName:
          type: string
        dmnNamespace:
          type: string
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/DecisionInfo"
          description: Decisions of the active version.
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/InputInfo"
          description: Inputs of the active version.
    ModelMessage:
      type: object
      properties:
        severity:
          type: string
        message:
          type: string
        type:
          type: string
        sourceId:
          type: string
    OffsetDateTime:
      type: string
      format: date-time
      examples:
      - 2022-03-10T12:15:50-04:00
    RegisterVersionRequest:
      description: A DMN model to store as a new version.
      type: object
      required:
      - content
      properties:
        content:
          type: string
          description: The DMN file as XML.
        author:
          type: string
          description: Who provides this version.
        description:
          type: string
          description: What changed.
        source:
          description: Origin of the version. Defaults to API.
          type: string
          $ref: "#/components/schemas/VersionSource"
        activate:
          type: boolean
          description: "true = go live now, false = keep as draft. Not set = the first\
            \ version of a model and project deployments go live, unless the active\
            \ version was activated from the Portal or the API."
        effectiveDate:
          description: Go live at this time instead of now.
          type: string
          $ref: "#/components/schemas/OffsetDateTime"
    ValidateRequest:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          description: The DMN file as XML.
    ValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ModelMessage"
    Version:
      type: object
      properties:
        model:
          type: string
        version:
          type: integer
          format: int32
        status:
          $ref: "#/components/schemas/VersionStatus"
        source:
          $ref: "#/components/schemas/VersionSource"
        author:
          type: string
        description:
          type: string
        createdAt:
          $ref: "#/components/schemas/OffsetDateTime"
        effectiveDate:
          $ref: "#/components/schemas/OffsetDateTime"
        activatedAt:
          $ref: "#/components/schemas/OffsetDateTime"
        activatedBy:
          type: string
        previousVersion:
          type: integer
          format: int32
        dmnName:
          type: string
        dmnNamespace:
          type: string
        contentHash:
          type: string
        created:
          type: boolean
          description: "Only on registration: false if the same content was already\
            \ stored."
    VersionSource:
      type: string
      enum:
      - PROJECT
      - PORTAL
      - API
    VersionStatus:
      type: string
      enum:
      - DRAFT
      - APPROVED
      - ACTIVE
      - RETIRED
tags:
- name: Models
  description: "Load DMN models, manage their versions and evaluate decisions."
- name: Validation
  description: Check a DMN file without storing it.
paths:
  /api/models:
    get:
      summary: Lists all models.
      tags:
      - Models
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"
  /api/models/{model}:
    get:
      summary: "Describes a model: its versions and the decisions and inputs of the\
        \ active version."
      tags:
      - Models
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
    delete:
      summary: Removes a model with all its versions.
      tags:
      - Models
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
  /api/models/{model}/evaluate:
    post:
      summary: Evaluates the active version of a model.
      tags:
      - Models
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResponse"
        "400":
          description: Bad Request
  /api/models/{model}/rollback:
    post:
      summary: Activates the version that was active before the current one.
      tags:
      - Models
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      - name: user
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /api/models/{model}/versions:
    get:
      summary: "Lists the versions of a model, newest first."
      tags:
      - Models
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Version"
    post:
      summary: Loads a DMN model as a new version.
      tags:
      - Models
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      - name: activate
        in: query
        schema:
          type: boolean
      - name: author
        in: query
        schema:
          type: string
      - name: description
        in: query
        schema:
          type: string
      - description: "ISO-8601 date and time with offset, e.g. 2027-01-01T00:00:00+01:00"
        name: effectiveDate
        in: query
        schema:
          type: string
      - name: source
        in: query
        schema:
          $ref: "#/components/schemas/VersionSource"
      requestBody:
        content:
          application/xml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterVersionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      description: Content that is already stored for the model does not create another
        version. An invalid DMN file is rejected with INVALID_MODEL and the findings
        of the DMN engine.
  /api/models/{model}/versions/{version}:
    get:
      summary: Describes one version.
      tags:
      - Models
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /api/models/{model}/versions/{version}/activate:
    post:
      summary: "Makes a version the active one, now or at an effective date."
      description: "The version that was active becomes retired. No restart, running\
        \ evaluations are not affected."
      tags:
      - Models
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          description: Bad Request
  /api/models/{model}/versions/{version}/approve:
    post:
      summary: Releases a draft for activation.
      tags:
      - Models
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /api/models/{model}/versions/{version}/content:
    get:
      summary: "Exports the DMN file of a version, e.g. to bring it back into the\
        \ Ivy project."
      tags:
      - Models
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                type: string
  /api/models/{model}/versions/{version}/evaluate:
    post:
      summary: "Evaluates a specific version, e.g. to test a draft before it goes\
        \ live."
      tags:
      - Models
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResponse"
        "400":
          description: Bad Request
  /api/models/{model}/versions/{version}/retire:
    post:
      summary: Withdraws a version that is not active.
      tags:
      - Models
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /api/validate:
    post:
      summary: "Validates a DMN file against the DMN schema, the model rules and the\
        \ compiler."
      tags:
      - Validation
      requestBody:
        content:
          application/xml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResponse"
info:
  title: Axon Ivy Rules Engine - Runtime API
  version: 1.0.0
  description: "Loads DMN models at runtime, manages their versions and evaluates\
    \ decisions."
servers:
- url: http://localhost:8080
  description: Auto generated value
- url: http://0.0.0.0:8080
  description: Auto generated value
