# yaml-language-server: $schema=https://json-schema.axonivy.com/14.0/config/rest-clients.json
RestClients:
  # The DMN engine container (Apache KIE JIT runner), called by the Java client RuleEngineClient.
  # This client is the place to configure TLS and other connection properties.
  ruleEngine:
    # A placeholder without path: RuntimeUrlFeature sends each call to the variable RuleEngine.Url instead.
    Url: http://localhost:8090
    Features:
      - ch.ivyteam.ivy.rest.client.mapper.JsonFeature
      - com.axonivy.utils.rule.engine.client.internal.RuntimeUrlFeature
    Properties:
      # answers of a newer engine may have fields this connector does not know yet
      JSON.Deserialization.FAIL_ON_UNKNOWN_PROPERTIES: false
      # decimal results of a decision keep their exact value
      JSON.Deserialization.USE_BIG_DECIMAL_FOR_FLOATS: true
