quarkus.application.name=axon-ivy-rules-engine
quarkus.http.port=8080
quarkus.http.limits.max-body-size=20M
quarkus.banner.enabled=false
# The DMN editor of the page /editor/ is a 12 MB script, compressed about 3 MB.
quarkus.http.enable-compression=true

rule.engine.data-dir=./data
# Shared secret that protects /api/*. Empty = no authentication (development only).
rule.engine.api-key=
rule.engine.sync-interval=5s
rule.engine.type-check=true
rule.engine.version-cache-size=20

quarkus.datasource.db-kind=h2
quarkus.datasource.username=rules
quarkus.datasource.password=rules
quarkus.datasource.jdbc.url=jdbc:h2:file:${rule.engine.data-dir}/rule-engine;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.log.sql=false

%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:rules;DB_CLOSE_DELAY=-1
# a free port: 8081, the default of Quarkus tests, is often taken by the engine of the Axon Ivy Designer
%test.quarkus.http.test-port=0
%test.rule.engine.sync-interval=1s
%dev.quarkus.http.port=8090

quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.write-durations-as-timestamps=false
quarkus.jackson.fail-on-unknown-properties=false

quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=Axon Ivy Rules Engine - Runtime API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Loads DMN models at runtime, manages their versions and evaluates decisions.
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

quarkus.log.category."org.kie".level=WARN
quarkus.log.category."org.drools".level=WARN
