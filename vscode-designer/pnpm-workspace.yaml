packages:
  - webviews/*
  - playwright
  - extension
minimumReleaseAgeExclude:
  - '@axonivy/*'
overrides:
  dompurify: '>=3.4.11'
patchedDependencies:
  '@axonivy/process-editor-inscription-view@14.0.2-next.2504.e51f3910': patches/@axonivy__process-editor-inscription-view@14.0.2-next.2504.e51f3910.patch
  monaco-editor: patches/monaco-editor.patch
preferWorkspacePackages: true
publicHoistPattern:
  - eslint
registries:
  '@axonivy': 'https://npmjs-registry.ivyteam.ch/'
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # minutes (30 days)
allowBuilds:
  '@swc/core': false
  '@vscode/vsce-sign': false
  esbuild: false
  keytar: false
verifyDepsBeforeRun: warn
autoDedupe: true
